<!doctype html><html lang="en"><head><title>4×4 & Zone 2 Coach</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1530"><meta name="color-scheme" content="dark"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Saira+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Layout: one console column (max 560px) with a bottom tab bar. The live session owns the whole screen.
   Dark only, by choice: a treadmill console read at arm's length in a gym.
   Palette: Norwegian navy, flag red for work, glacier blue for recovery, fjord teal for warm-up, spruce green for Zone 2. */
:root{
  color-scheme: dark;
  --night:#0a1530;
  --deck:#101e3d;
  --deck-2:#172a50;
  --deck-3:#22375f;
  --rule:#2b4068;
  --ink:#eef3fb;
  --ink-2:#b4c1d9;
  --ink-3:#8796b5;
  --flag:#f0445a;
  --flag-btn:#c42a41;
  --glacier:#93d0f2;
  --fjord:#46bfae;
  --spruce:#69cf93;
  --amber:#f4bb4f;
  --on-light:#0a1530;
  --on-red:#ffffff;
  --on-green:#062312;
  --shade:rgba(3,8,22,.62);
  --shadow:rgba(0,0,0,.45);
  --z1:#8197bd; --z2:#69cf93; --z3:#e6d35e; --z4:#f59c4a; --z5:#f0445a;
  --display:"Saira Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r1:10px; --r2:16px; --r3:22px;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--night)}
body{background:var(--night);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
a{color:var(--glacier)}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.05;text-wrap:balance}
h1{font-size:36px}
h2{font-size:24px}
h3{font-size:20px}
p{margin:0}
:focus-visible{outline:3px solid var(--glacier);outline-offset:2px;border-radius:6px}
.eyebrow{font:700 12px/1.25 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.tnum{font-variant-numeric:tabular-nums}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(104px + env(safe-area-inset-bottom,0px));outline:none;display:flex;flex-direction:column;gap:14px}
body.is-live .wrap{padding-block:8px 28px}
body.is-live .tabs{display:none}
.section{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head a,.link{font-weight:700;color:var(--glacier);text-decoration:none;font-size:15px}
.link{align-self:flex-start;min-height:44px;display:inline-flex;align-items:center}
.link.danger{color:var(--flag)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--night);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font:700 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--flag)}

/* generic controls */
.btn{min-height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--rule);background:var(--deck-2);color:var(--ink);font:700 17px/1.15 var(--body);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--ink);color:var(--on-light);border-color:var(--ink)}
.btn.red{background:var(--flag-btn);border-color:var(--flag-btn);color:var(--on-red)}
.btn.green{background:var(--spruce);border-color:var(--spruce);color:var(--on-green)}
.btn.ghost{background:transparent}
.btn.xl{min-height:64px;font-size:20px;border-radius:18px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.btn-row>.btn{flex:1 1 140px}
.card{background:var(--deck);border:1px solid var(--rule);border-radius:var(--r2);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.note{font-size:15px;line-height:1.4;color:var(--ink-2);background:var(--deck);border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.note.warn{border-color:var(--amber);color:var(--ink)}
.note.stop{border-color:var(--flag);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;scroll-snap-type:x proximity}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:46px;min-width:52px;padding:0 12px;border-radius:12px;background:var(--deck-2);border:1px solid var(--rule);color:var(--ink);font:700 19px/1 var(--display);font-variant-numeric:tabular-nums;scroll-snap-align:center;position:relative}
.chip.tgt::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--spruce)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-light);border-color:var(--ink)}
.chip.txt{font:700 15px/1.1 var(--body)}
.chips.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.chips.grid5 .chip{min-width:0;justify-content:center;text-align:center;padding:0 6px}
.chips.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.chips.grid2 .chip{min-width:0;padding:6px 8px}
.chips.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.chips.grid3 .chip{min-width:0;padding:6px 8px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg-b{min-height:56px;border-radius:14px;border:2px solid var(--rule);background:var(--deck);font:700 20px/1 var(--display);letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:8px}
.seg-b::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--sc)}
.seg-b[data-v="gruen"]{--sc:var(--spruce)}
.seg-b[data-v="gelb"]{--sc:var(--amber)}
.seg-b[data-v="rot"]{--sc:var(--flag)}
.seg-b[aria-checked="true"]{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 20%,var(--deck))}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:14px;background:var(--deck);border:1px solid var(--rule)}
.toggle .tl{display:flex;flex-direction:column;min-width:0}
.toggle .th{font-size:13px;color:var(--ink-3)}
.sw{flex:none;width:48px;height:28px;border-radius:99px;background:var(--deck-3);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink-2);transition:transform .15s}
.toggle[aria-checked="true"] .sw{background:var(--glacier)}
.toggle[aria-checked="true"] .sw::after{transform:translateX(20px);background:var(--night)}
.checks{display:flex;flex-direction:column;gap:8px}
.ck{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border-radius:14px;background:var(--deck);border:1px solid var(--rule);width:100%}
.ck .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--ink-3);display:grid;place-items:center;color:transparent}
.ck .box svg{width:18px;height:18px}
.ck[aria-checked="true"] .box{background:var(--spruce);border-color:var(--spruce);color:var(--on-green)}
.ck[aria-checked="true"] .t{color:var(--ink-3)}
.stepper{display:grid;grid-template-columns:48px minmax(72px,auto) 48px;align-items:center;gap:6px}
.stepper button{height:48px;border-radius:12px;background:var(--deck-2);border:1px solid var(--rule);font:700 26px/1 var(--display);display:grid;place-items:center}
.stepper output{font:700 24px/1 var(--display);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.row:first-child{border-top:0;padding-top:0}
.row:last-child{padding-bottom:0}
.row-l{min-width:0}
.row-k{font-weight:700}
.row-h{display:block;font-size:13px;color:var(--ink-3)}

/* home */
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync[data-s="on"]::before{background:var(--spruce)}
.sync[data-s="slow"]::before{background:var(--amber)}
.hero{position:relative;overflow:hidden;background:linear-gradient(165deg,var(--deck-2),var(--deck) 72%);border:1px solid var(--rule);border-radius:var(--r3);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:44px;line-height:.95}
.hero[data-t="4x4"] h1{color:var(--flag)}
.hero[data-t="z2"] h1{color:var(--spruce)}
.hero .lead{font-size:17px;color:var(--ink-2);max-width:40ch}
.hero .btn-row{margin-top:6px}
.hero-pf{margin-top:4px;display:flex;flex-direction:column;gap:6px}
.badge{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--spruce) 22%,transparent);color:var(--spruce);font:700 14px/1 var(--body)}
.runbar{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px;border-radius:14px;background:var(--flag-btn);color:var(--on-red);text-decoration:none;font-weight:700}
.runbar .rb-t{flex:1;min-width:0;font-variant-numeric:tabular-nums}
.runbar .rb-dot{width:10px;height:10px;border-radius:50%;background:var(--on-red);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.week{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 7px;border-radius:12px;background:var(--deck);border:1px solid var(--rule);min-width:0}
.day .dn{font:700 11px/1 var(--body);color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.day .dt{font:700 16px/1 var(--display);white-space:nowrap}
.day[data-t="4x4"] .dt{color:var(--flag)}
.day[data-t="z2"] .dt{color:var(--spruce)}
.day[data-t="kraft"] .dt{color:var(--ink-2)}
.day[data-t="frei"] .dt{color:var(--ink-3)}
.day.today{border-color:var(--ink);background:var(--deck-2)}
.dm{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--deck-3)}
.dm svg{width:14px;height:14px}
.dm.done{border:0;background:var(--spruce);color:var(--on-green)}
.dm.extra{border:0;background:var(--glacier);color:var(--on-light)}
.dm.na{border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:var(--deck);border:1px solid var(--rule);border-radius:14px;padding:10px 12px 11px;min-width:0;display:flex;flex-direction:column;gap:4px}
.kpi .k{font:700 11px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font:700 27px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font:600 15px/1 var(--display);color:var(--ink-2);margin-left:2px}
.mbar{height:5px;border-radius:99px;background:var(--deck-3);overflow:hidden;margin-top:4px}
.mbar i{display:block;height:100%;border-radius:inherit;background:var(--mc,var(--glacier))}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{display:flex;flex-direction:column;gap:6px;background:var(--deck);border:1px solid var(--rule);border-radius:var(--r2);padding:14px 14px 12px;min-width:0;width:100%}
.mode .mk{font:700 30px/1 var(--display)}
.mode .small{flex:1}
.mode[data-m="4x4"] .mk{color:var(--flag)}
.mode[data-m="z2"] .mk{color:var(--spruce)}
.mode .go{display:flex;align-items:center;justify-content:space-between;font-weight:700;color:var(--ink)}
.mode .go svg{width:20px;height:20px}
.zbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.zseg{border-radius:8px;padding:7px 6px 6px;background:color-mix(in srgb,var(--zc) 16%,var(--deck));border-top:3px solid var(--zc);min-width:0}
.zseg .zn{display:block;font:700 12px/1 var(--display);color:var(--zc);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.zseg .zr{display:block;font:700 22px/1.05 var(--display);font-variant-numeric:tabular-nums;margin-top:3px}
.zseg .zt{display:block;font:600 12px/1.2 var(--body);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* heart rate source panel */
.hrp{background:var(--deck);border:1px solid var(--rule);border-radius:var(--r2);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hrp[data-s="live"]{border-color:color-mix(in srgb,var(--spruce) 60%,var(--rule))}
.hrp[data-s="lost"],.hrp[data-s="error"]{border-color:var(--amber)}
.hrp-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hrp-t{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.hrp-t .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--ink-3)}
.hrp[data-s="live"] .dot{background:var(--spruce);box-shadow:0 0 0 4px color-mix(in srgb,var(--spruce) 25%,transparent)}
.hrp[data-s="connecting"] .dot,.hrp[data-s="lost"] .dot{background:var(--amber)}
.hrp-b{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.hrp-b small{font:700 13px/1 var(--body);color:var(--ink-3);margin-left:3px}
.hrp p{color:var(--ink-2);font-size:15px;line-height:1.4}
.hrp ol{margin:0;padding-left:20px;color:var(--ink-2);font-size:15px;line-height:1.45;display:flex;flex-direction:column;gap:4px}

/* profile + charts */
.profile{display:block;width:100%;height:56px}
.profile rect.todo{opacity:.28}
.profile rect.done{opacity:.55}
.profile .play{stroke:var(--ink);stroke-width:2.5}
.profile .mk{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.pf-l{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink-3);margin-top:4px}
.pf-l span:last-child{text-align:right}
.chart{display:block;width:100%;height:auto}
.chart .ax{fill:var(--ink-3);font:600 11px var(--body)}
.chart .lb{fill:var(--ink-2);font:700 12px var(--body)}
.chart .gl{stroke:var(--rule);stroke-width:1}
.chart .tl{stroke:var(--amber);stroke-width:1.5;stroke-dasharray:5 4}
.chart .z5l{stroke:var(--flag);stroke-width:1.2;stroke-dasharray:4 4}
.chart .band{fill:var(--spruce);opacity:.13}
.chart .aim{fill:var(--spruce);opacity:.22}
.chart .tband{fill:var(--flag);opacity:.16}
.chart .wk{fill:var(--flag);opacity:.08}
.chart .ln{fill:none;stroke:var(--glacier);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.thin{stroke-width:2}
.chart .pt{fill:var(--night);stroke:var(--glacier);stroke-width:2.5}
.chart .pt.last{fill:var(--glacier)}
.chart .bar-z2{fill:var(--spruce)}
.chart .bar-now{fill:var(--glacier)}

/* live */
.live{display:flex;flex-direction:column;gap:10px}
.lv-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px}
.lv-title{display:flex;flex-direction:column;gap:3px;min-width:0}
.lv-mode{font:700 12px/1.1 var(--body);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-mode #lv-rem{color:var(--ink-2)}
.lv-step{font:700 22px/1.05 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-acts{display:flex;align-items:center;gap:6px;flex:none}
.icon{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;background:var(--deck);border:1px solid var(--rule);color:var(--ink)}
.icon svg{width:22px;height:22px}
.notice{width:100%;min-height:48px;padding:8px 14px;border-radius:12px;background:var(--amber);color:var(--on-light);font-weight:700;text-align:center}
.phase{--pc:var(--fjord);border-radius:var(--r3);padding:12px 18px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 24%,var(--deck)) 0%,var(--deck) 88%);border:1.5px solid color-mix(in srgb,var(--pc) 55%,transparent)}
.phase[data-type="work"]{--pc:var(--flag)}
.phase[data-type="rec"]{--pc:var(--glacier)}
.phase[data-type="pick"]{--pc:var(--amber)}
.phase[data-type="z2"],.phase[data-type="z2in"]{--pc:var(--spruce)}
.ph-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ph-name{font:800 27px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--pc);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph-of{font:600 16px/1 var(--display);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.clock{font:700 clamp(88px,28vw,168px)/.92 var(--display);display:flex;justify-content:center;margin:6px 0 10px;color:var(--ink)}
body.has-hr .clock{font-size:clamp(78px,24vw,150px)}
.clock .d{display:inline-block;min-width:.5em;text-align:center}
.clock .c{display:inline-block;min-width:.25em;text-align:center;opacity:.75;transform:translateY(-.04em)}
.phase.paused .clock{opacity:.4}
.phase.ending{animation:edge 1s ease-in-out infinite}
@keyframes edge{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--pc) 55%,transparent)}}
.bar{position:relative;height:10px;border-radius:99px;background:color-mix(in srgb,var(--pc) 16%,var(--night))}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--pc);border-radius:inherit}
.bar .tk{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);opacity:.55;border-radius:2px}
.targets{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;margin-top:12px;align-items:end}
.tg{display:flex;flex-direction:column;gap:3px;min-width:0}
.tg .k{font:700 11px/1.2 var(--body);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.tg .v{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.hrrow{--hc:var(--ink);display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--deck);border:1.5px solid color-mix(in srgb,var(--hc) 45%,var(--rule));border-radius:var(--r2);padding:10px 14px}
.hrbig{display:flex;align-items:baseline;gap:5px}
.hrbig .n{font:800 54px/.9 var(--display);font-variant-numeric:tabular-nums;color:var(--hc);min-width:2.1ch;text-align:right}
.hrbig .u{font:700 13px/1 var(--body);color:var(--ink-3)}
.hrr{display:flex;flex-direction:column;gap:7px;min-width:0}
.hrr-t{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.hrr-t b{color:var(--hc)}
.gauge{position:relative;height:12px;border-radius:99px;overflow:visible}
.gauge .gt{position:absolute;inset:0;border-radius:99px;opacity:.55}
.gauge .gb{position:absolute;top:-4px;bottom:-4px;border:2px solid var(--ink);border-radius:6px}
.gauge .gm{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 2px var(--night)}
.coach{font-size:19px;line-height:1.36;background:var(--deck);border:1px solid var(--rule);border-radius:var(--r2);padding:12px 14px;min-height:4.2em}
.coach b{color:var(--ink);background:color-mix(in srgb,var(--glacier) 22%,transparent);padding:0 4px;border-radius:5px;white-space:nowrap}
.speed{display:grid;grid-template-columns:76px minmax(0,1fr) 76px;gap:10px;align-items:stretch}
.speed>button{min-height:68px;border-radius:var(--r2);background:var(--deck-2);border:1px solid var(--rule);font:700 24px/1 var(--display);text-align:center}
.speed .val{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--deck);border:1px solid var(--rule);border-radius:var(--r2);min-width:0;padding:6px 4px;transition:background .3s}
.speed .val.flash{background:color-mix(in srgb,var(--glacier) 28%,var(--deck))}
.speed .sv{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums}
.speed .su{font-size:12px;color:var(--ink-3);text-align:center}
.z2b{display:flex;flex-direction:column;gap:10px}
.z2-next{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--deck);border:1px solid var(--rule);border-radius:14px;padding:10px 14px}
.z2-next .v{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.ctrl{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;gap:10px}
.ctrl>button{min-height:62px;border-radius:var(--r2);background:var(--deck-2);border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;gap:8px;font:700 20px/1 var(--body)}
.ctrl>button svg{width:26px;height:26px}
.ctrl .pp{background:var(--ink);color:var(--on-light);border-color:var(--ink)}
.ctrl .pp.paused{background:var(--spruce);color:var(--on-green);border-color:var(--spruce)}
.ctrl2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.btn.warnb{background:transparent;border-color:var(--flag);color:var(--flag)}
.lv-stats{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.lv-stats b{color:var(--ink);font:700 17px/1 var(--display)}
.wake{font-size:13px;color:var(--ink-3);text-align:center}
.wake[data-s="denied"],.wake[data-s="unsupported"]{color:var(--amber)}

/* sheet, toast */
.sheet-back{position:fixed;inset:0;z-index:40;background:var(--shade)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:84vh;overflow-y:auto;background:var(--deck);border-top:1px solid var(--rule);border-radius:var(--r3) var(--r3) 0 0;box-shadow:0 -12px 40px var(--shadow);padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sh-text{color:var(--ink-2)}
.sh-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.sh-actions.col{grid-template-columns:1fr}
.hr-step{display:grid;grid-template-columns:76px minmax(0,1fr) 76px;gap:10px;align-items:center}
.hr-val{font:800 66px/1 var(--display);text-align:center;font-variant-numeric:tabular-nums}
.stp{min-height:66px;border-radius:var(--r2);background:var(--deck-2);border:1px solid var(--rule);font:700 32px/1 var(--display);text-align:center}
.sh-label{font:700 12px/1.2 var(--body);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
textarea{width:100%;min-height:96px;resize:vertical;background:var(--deck);color:var(--ink);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;font:400 16px/1.4 var(--body)}
textarea:focus{outline:2px solid var(--glacier);outline-offset:1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;width:max-content;max-width:min(92vw,520px);background:var(--ink);color:var(--on-light);border-radius:14px;padding:12px 16px;font-weight:700;box-shadow:0 8px 30px var(--shadow)}
body.is-live .toast{bottom:auto;top:calc(10px + env(safe-area-inset-top,0px))}

/* summary + history */
.score{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:center}
.ring{width:112px;height:112px;display:block}
.ring .bg{fill:none;stroke:var(--deck-3);stroke-width:10}
.ring .fg{fill:none;stroke-width:10;stroke-linecap:round}
.ring .rv{fill:var(--ink);font:700 36px var(--display)}
.ring .ru{fill:var(--ink-3);font:700 11px var(--body);letter-spacing:.08em}
.parts{display:flex;flex-direction:column;gap:9px;min-width:0}
.part .pk{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--ink-2)}
.part .pk b{color:var(--ink);font-variant-numeric:tabular-nums}
.pb{height:6px;border-radius:99px;background:var(--deck-3);overflow:hidden;margin-top:4px}
.pb i{display:block;height:100%;border-radius:inherit;background:var(--glacier)}
.ivt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ivt th{font:700 11px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:0 6px 6px}
.ivt td{padding:10px 6px;border-top:1px solid var(--rule);font:600 19px/1.2 var(--display);vertical-align:middle}
.ivt tbody tr{cursor:pointer}
.ivt tbody tr:active td{background:var(--deck-2)}
.ivt .sub{display:block;font:400 12px/1.2 var(--body);color:var(--ink-3)}
.pill{display:inline-block;min-width:48px;text-align:center;padding:4px 8px;border-radius:8px;font:700 19px/1 var(--display)}
.pill.ok{background:color-mix(in srgb,var(--spruce) 24%,transparent);color:var(--spruce)}
.pill.lo{background:color-mix(in srgb,var(--glacier) 22%,transparent);color:var(--glacier)}
.pill.hi{background:color-mix(in srgb,var(--amber) 24%,transparent);color:var(--amber)}
.pill.miss{border:1.5px dashed var(--ink-3);color:var(--ink-2);font:700 13px/1 var(--body);padding:6px 8px}
.next{border-color:var(--glacier)}
.next .nv{font:700 40px/1 var(--display);font-variant-numeric:tabular-nums}
.hist{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px;border-radius:14px;background:var(--deck);border:1px solid var(--rule)}
.hb{font:800 16px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;text-align:center;padding:8px 0;border-radius:10px}
.hb.r{background:color-mix(in srgb,var(--flag) 20%,transparent);color:var(--flag)}
.hb.g{background:color-mix(in srgb,var(--spruce) 20%,transparent);color:var(--spruce)}
.hm{display:flex;flex-direction:column;gap:3px;min-width:0}
.hd{font-weight:700}
.hl{font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.hs{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.hs.s-hi{color:var(--spruce)}
.hs.s-mid{color:var(--amber)}
.hs.s-lo{color:var(--flag)}
.hs.s-na{color:var(--ink-3)}
.list{display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;padding:26px 16px;color:var(--ink-2);border:1.5px dashed var(--rule);border-radius:var(--r2);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h3{color:var(--ink)}

/* learn */
.k-sec{display:flex;flex-direction:column;gap:10px}
.k-sec p,.k-sec li{color:var(--ink-2);font-size:16px;line-height:1.5}
.k-sec strong{color:var(--ink)}
.k-sec ol,.k-sec ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r2)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font:700 11px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 10px 8px;background:var(--deck)}
.tbl td{padding:9px 10px;border-top:1px solid var(--rule);font-size:15px;vertical-align:top}
.tbl td.n{font:700 17px/1.2 var(--display);white-space:nowrap}
.tbl td .sub{display:block;font:400 12px/1.3 var(--body);color:var(--ink-3);white-space:normal}
.zdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--zc);margin-right:6px}
.steps{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:var(--r2);overflow:hidden;background:var(--deck)}
.stp-r{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:11px 14px;border-top:1px solid var(--rule)}
.stp-r:first-child{border-top:0}
.stp-r .sm{font:700 18px/1.25 var(--display);font-variant-numeric:tabular-nums;color:var(--fjord)}
.stp-r[data-t="work"] .sm{color:var(--flag)}
.stp-r[data-t="rec"] .sm{color:var(--glacier)}
.stp-r[data-t="pick"] .sm{color:var(--amber)}
.stp-r .sd{color:var(--ink-2);font-size:15px;line-height:1.4;min-width:0}
.stp-r .sd b{color:var(--ink)}
.stp-r .sd span{display:block;font-size:14px;color:var(--ink-3)}
.plan{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.pd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0;border-radius:12px;background:var(--deck-2);border:1px solid var(--rule);min-width:0}
.pd .dn{font:700 11px/1 var(--body);color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.pd .dt{font:700 16px/1 var(--display);white-space:nowrap}
.pd[data-t="4x4"] .dt{color:var(--flag)}
.pd[data-t="z2"] .dt{color:var(--spruce)}
.pd[data-t="frei"] .dt{color:var(--ink-3)}
.vstat{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.vstat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.vstat[data-s="ready"]::before{background:var(--spruce)}
.vstat[data-s="loading"]::before{background:var(--amber)}
.vstat[data-s="failed"]::before{background:var(--flag)}

  .runbar .rb-dot{animation:none}
  .sw,.sw::after,.speed .val{transition:none}

function offerRewarm(len) {

}

function hrChartSVG(o) {

  const yl = [];

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Heart rate over time, from ${Math.min(...vals)} to ${Math.max(...vals)} bpm">
    ${work.map(([a, b]) => `<rect class="wk" x="${x(a).toFixed(1)}" y="${pt}" width="${Math.max(1, x(b) - x(a)).toFixed(1)}" height="${H - pt - pb}"/>`).join('')}
    ${o.band ? `<rect class="${o.z5 ? 'tband' : 'aim'}" x="${pl}" y="${y(o.band[1]).toFixed(1)}" width="${W - pl - pr}" height="${Math.max(1, y(o.band[0]) - y(o.band[1])).toFixed(1)}"/>` : ''}
    ${o.zone ? `<rect class="band" x="${pl}" y="${y(o.zone[1]).toFixed(1)}" width="${W - pl - pr}" height="${Math.max(1, y(o.zone[0]) - y(o.zone[1])).toFixed(1)}"/>` : ''}
    ${o.z5 ? `<line class="z5l" x1="${pl}" x2="${W - pr}" y1="${y(o.z5).toFixed(1)}" y2="${y(o.z5).toFixed(1)}"/><text class="ax" x="${W - pr - 2}" y="${(y(o.z5) - 4).toFixed(1)}" text-anchor="end">Zone 5</text>` : ''}
    <line class="gl" x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}"/>
    ${yl.map(v => `<text class="ax" x="${pl - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`).join('')}
    ${ticks.map((m, i) => `<text class="ax" x="${x(m * 60).toFixed(1)}" y="${H - 6}" text-anchor="${i === ticks.length - 1 && m * 60 >= total - 30 ? 'end' : 'middle'}">${m}${i === ticks.length - 1 ? ' min' : ''}</text>`).join('')}
    <path class="ln thin" d="${path}"/>
    ${lastI >= 0 ? `<circle class="pt last" cx="${x(lastI * 5).toFixed(1)}" cy="${y(o.hr5[lastI]).toFixed(1)}" r="4"/>` : ''}

}

function weeksChartSVG() {
  const st = Store.settings, W = 340, H = 160, pl = 36, pr = 10, pt = 16, pb = 26, now = new Date(), ws0 = weekStart(now), weeks = [];

  const maxV = Math.max(st.z2Week || 60, ...weeks.map(w => w.mins)) * 1.18;
  const y = v => pt + (1 - v / maxV) * (H - pt - pb), cw = (W - pl - pr) / 6, bw = cw * 0.56;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Zone 2 minutes per week: ${weeks.map(w => 'week ' + w.kw + ' ' + w.mins).join(', ')}">
    <line class="gl" x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}"/><text class="ax" x="${pl - 6}" y="${y(0) + 4}" text-anchor="end">0</text>

    ${weeks.every(w => !w.mins) ? `<text class="lb" x="${(pl + W - pr) / 2}" y="${((y(st.z2Week || 0) + y(0)) / 2 + 4).toFixed(1)}" text-anchor="middle">No Zone 2 in the last 6 weeks yet</text>` : ''}

function speedTrendSVG(list) {

  btConnect: () => { BLE.connect(); },
  btDisconnect: () => { BLE.release(false); toast('WHOOP disconnected.'); },
  start4x4: () => {
    if (!UI4 || !UI4.rec) return;
    if (S) { toast('A session is already running.'); go(S.closedPause ? 'today' : 'live'); return; }
    if (UI4.rec === 'rot') { initUIZ(); UIZ.minutes = 60; go('prep-z2'); return; }
    Snd.unlock();
    startSession('4x4', {recovery: UI4.rec, legsHeavy: UI4.legs, startSpeed: UI4.speed, incline: Store.settings.incline});
  },
  zMin: t => { UIZ.minutes = Number(t.dataset.v); rerenderKeep(); },
  zSpd: t => { UIZ.speed = clamp(r1(UIZ.speed + Number(t.dataset.d)), 1, 12); UIZ.bare = withoutVest(UIZ.speed, UIZ.vest, Store.settings.incline, Store.settings.weight); rerenderKeep(); },
  zVest: t => setUIZVest(Number(t.dataset.v)),
  zVestStep: t => setUIZVest(UIZ.vest + Number(t.dataset.d)),
  zEvery: t => { UIZ.every = Number(t.dataset.v); rerenderKeep(); },
  zQuiet: () => { UIZ.quiet = !UIZ.quiet; Store.setSetting('z2Quiet', UIZ.quiet); rerenderKeep(); },
  startZ2: () => { if (S) { toast('A session is already running.'); go(S.closedPause ? 'today' : 'live'); return; } Snd.unlock(); if (UIZ.vest !== Store.settings.vestKg) Store.setSetting('vestKg', UIZ.vest); startSession('z2', {minutes: UIZ.minutes, speed: UIZ.speed, vestKg: UIZ.vest, every: UIZ.every, quiet: UIZ.quiet, incline: Store.settings.incline}); },
  demo4x4: () => { if (S) { toast('End the running session first.'); return; } Snd.unlock(); const rec = UI4 && (UI4.rec === 'gruen' || UI4.rec === 'gelb') ? UI4.rec : 'gruen'; startSession('4x4', {recovery: rec, legsHeavy: !!(UI4 && UI4.legs), startSpeed: UI4 ? UI4.speed : Store.settings.speed4x4, incline: Store.settings.incline}, 10); },
  demoZ2: () => { if (S) { toast('End the running session first.'); return; } Snd.unlock(); if (!UIZ) initUIZ(); startSession('z2', {minutes: UIZ.minutes, speed: UIZ.speed, vestKg: UIZ.vest, every: UIZ.every, quiet: UIZ.quiet, incline: Store.settings.incline}, 10); },
  spd: t => setSpeed(Number(t.dataset.d)),
  pause: () => pauseToggle(),
  skip: () => { if (armedTwice('skip', 'Tap again to skip this phase')) skipPhase(); },
  back: () => { if (armedTwice('back', 'Tap again to restart this phase')) backPhase(); },
  bail: () => { if (armedTwice('bail', 'Tap again to end this interval and recover')) bailDo(); },
  rewarm: () => doRewarm(),
  restartPhase: () => restartPhase(),
  hrNow: () => {
    if (!S) return;
    if (S.mode === 'z2') { closeSheet(); openCheckSheet(false); return; }
    const ph = curPhase();
    let n = ph.type === 'work' ? ph.n : 0;
    if (!n) for (let i = S.idx - 1; i >= 0; i--) if (S.phases[i].type === 'work') { n = S.phases[i].n; break; }
    if (!n) { toast('Finish heart rates start with interval 1.'); return; }
    closeSheet(); openHrSheet(n, 'live');
  },
  cycleSound: () => { if (!S) return; S.soundMode = S.soundMode === 'all' ? 'tones' : S.soundMode === 'tones' ? 'off' : 'all'; if (S.soundMode !== 'all') Speaker.stop(); toast(S.soundMode === 'all' ? 'Voice and tones on' : S.soundMode === 'tones' ? 'Tones only' : 'Muted, vibration stays on'); persistActive(); renderLive(); },
  unlockAudio: () => { Snd.unlock(); setTimeout(() => { Snd.play('tick'); if (S) liveDyn(clock()); }, 80); },
  endAsk: () => {
    if (!S) return;
    if (S.demo) { confirmSheet({title: 'End the test run?', text: 'You’ll see what the summary looks like. Nothing is saved.', buttons: [{label: 'End test run', act: 'endSave', cls: 'primary'}, {label: 'Keep watching', act: 'sheetClose'}]}); return; }
    const short = sessionEl(clock()) < 120000;
    confirmSheet({title: 'End the session?', text: short ? 'Less than 2 minutes. Hardly worth saving.' : 'Everything up to now is saved and scored.', buttons: short ? [{label: 'Discard', act: 'endDiscard', cls: 'primary'}, {label: 'Save anyway', act: 'endSave'}, {label: 'Keep training', act: 'sheetClose'}] : [{label: 'End and save', act: 'endSave', cls: 'primary'}, {label: 'Keep training', act: 'sheetClose'}, {label: 'Discard', act: 'endDiscard'}]});
  },
  endSave: () => { if (!S) return; closeSheet(); const now = clock(); tick(now); if (S) finishSession(now, true); },
  endDiscard: () => { closeSheet(); if (!S) return; const demo = S.demo; S = null; LS.del(K.active); Wake.release(); Speaker.stop(); if (demo) HR.reset(); toast('Session discarded.'); go('today'); render(); },
  resumeOpen: () => { if (!S) return; S.closedPause = false; persistActive(); go('live'); },
  sheetClose: () => closeSheet(),
  sheetBack: () => closeSheet(),
  hrStep: t => { if (!sheetState) return; sheetState.val = clamp(sheetState.val + Number(t.dataset.d), 60, 230); syncHrSheet(); },
  hrSet: t => { if (!sheetState) return; sheetState.val = Number(t.dataset.v); syncHrSheet(); },
  rpe: t => { if (!sheetState) return; const v = Number(t.dataset.v); sheetState.rpe = sheetState.rpe === v ? null : v; document.querySelectorAll('[data-act="rpe"]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === sheetState.rpe))); },
  talk: t => { if (!sheetState) return; sheetState.talk = t.dataset.v; document.querySelectorAll('[data-act="talk"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === sheetState.talk))); },
  hrSave: () => hrSave(),
  chkSave: () => chkSave(),
  sumHr: t => openHrSheet(Number(t.dataset.n), 'sum', lastSummaryId),
  z5: t => { const rec = recById(lastSummaryId); if (!rec) return; const base = isNum(rec.z5MinWhoop) ? rec.z5MinWhoop : rec.z5Min || 0; rec.z5MinWhoop = clamp(Math.round((base + Number(t.dataset.d)) * 2) / 2, 0, 30); $('#sum-z5').textContent = num(rec.z5MinWhoop); saveRec(rec, true); },
  undoMax: () => { const rec = recById(lastSummaryId); if (!rec || !isNum(rec.maxFrom)) return; Store.setSetting('hrMax', rec.maxFrom); toast(`Max heart rate back to ${rec.maxFrom}`); render(); },
  undoNext: () => {
    const rec = recById(lastSummaryId); if (!rec || !isNum(rec.autoFrom)) return;
    Store.setSetting(rec.mode === '4x4' ? 'speed4x4' : 'z2Speed', rec.autoFrom);
    if (isNum(rec.autoKgTo) && isNum(rec.autoKgFrom)) Store.setSetting('vestKg', rec.autoKgFrom);
    const back = vestOn(rec.autoFrom, rec.vestKg || 0, Store.settings, rec.incline);
    rec.autoTo = null; rec.autoKgTo = null; saveRec(rec, true); toast(`Start speed back to ${num(back)} km/h`); render();
  },
  applyNext: () => {
    const rec = recById(lastSummaryId); if (!rec || !rec.next) return;
    const kg = isNum(rec.next.vestKg) ? rec.next.vestKg : rec.vestKg || 0;
    Store.setSetting(rec.mode === '4x4' ? 'speed4x4' : 'z2Speed', vestOff(rec.next.speed, kg, Store.settings, rec.incline));
    if (rec.mode === 'z2' && kg !== Store.settings.vestKg) Store.setSetting('vestKg', kg);
    toast(`Start speed is now ${num(rec.next.speed)} km/h`); render();
  },
  copySession: () => { const rec = recById(lastSummaryId); if (rec) copyText(sessionText(rec)); },
  openSession: t => { lastSummaryId = t.dataset.id; go('summary'); },
  delAsk: () => confirmSheet({title: 'Delete this session?', text: 'It disappears from your history and your account. This can’t be undone.', buttons: [{label: 'Delete', act: 'delDo', cls: 'red'}, {label: 'Keep it', act: 'sheetClose'}]}),
  delDo: () => { const id = lastSummaryId; closeSheet(); if (id) { lastSummaryId = null; go('history'); Store.deleteSession(id); toast('Session deleted.'); } },
  set: t => {
    const k = t.dataset.k, dec = Number(t.dataset.dec);
    Store.setSetting(k, Number(Store.settings[k]) + Number(t.dataset.d));
    const o = $('#set-' + k); if (o) o.textContent = setVal(k, dec);
    if (k === 'hrMax' || k === 'hrRest') { const o2 = $('#set-hrRest'); if (o2) o2.textContent = setVal('hrRest', 0); const z = $('#set-zones'); if (z) z.innerHTML = zoneBarHTML(zonesOf(Store.settings)); }
  },
  plan: t => { const i = Number(t.dataset.i), p = Store.settings.plan.slice(); p[i] = PLAN_TYPES[(PLAN_TYPES.indexOf(p[i]) + 1) % PLAN_TYPES.length]; Store.setSetting('plan', p); t.dataset.t = p[i]; t.querySelector('.dt').textContent = PLAN_SHORT[p[i]]; t.setAttribute('aria-label', DAYS[i] + ': ' + PLAN_LONG[p[i]]); },
  exportAll: () => copyText(JSON.stringify({exported: new Date().toISOString(), app: 'treadmill-coach', settings: Store.settings, sessions: Store.sessions.map(cloudBody)}), 'All data copied.'),
  importOpen: () => importSheet(),
  impTake: t => { sheetState.take = !sheetState.take; t.setAttribute('aria-checked', String(sheetState.take)); },
  importDo: () => {
    const ta = $('#imp-ta'), raw = ta ? ta.value.trim() : '';
    let obj = null;
    try { obj = JSON.parse(raw); } catch (e) { obj = null; }
    const res = obj ? Store.importData(obj, sheetState && sheetState.take) : null;
    if (!res) { toast('That doesn’t look like coach data. Paste exactly what Copy all data gave you.'); return; }
    closeSheet();
    toast(`Imported ${res.added} new and ${res.updated} updated sessions${res.settings ? ', settings too' : ''}.`);
    render();
  }
};
function syncHrSheet() {
  const o = $('#sh-val'); if (o) o.textContent = sheetState.val;
  document.querySelectorAll('[data-act="hrSet"]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === sheetState.val)));
  const sel = document.querySelector('[data-act="hrSet"][aria-pressed="true"]'); if (sel) sel.scrollIntoView({block: 'nearest', inline: 'center'});
}
function rerenderKeep() {
  const y = window.scrollY, ae = document.activeElement, key = ae && ae.dataset ? ae.dataset.act + '|' + (ae.dataset.v || ae.dataset.d || ae.dataset.k || '') : null;
  render();
  window.scrollTo(0, y);
  if (key) { const el = Array.from(document.querySelectorAll('[data-act]')).find(e => e.dataset.act + '|' + (e.dataset.v || e.dataset.d || e.dataset.k || '') === key); if (el) try { el.focus({preventScroll: true}); } catch (e) {} }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act];
  if (!fn) return;
  e.preventDefault();
  Snd.unlock();
  fn(t, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetState) { closeSheet(); return; }
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t && t.tagName === 'TR' && t.dataset.act) { e.preventDefault(); t.click(); return; }
  if (e.key === ' ' && route() === 'live' && S && !sheetState && t === document.body) { e.preventDefault(); pauseToggle(); }
});
document.addEventListener('pointerdown', () => Snd.unlock(), {passive: true});
let noteTimer = null;
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'sum-note') {
    const val = e.target.value;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { const rec = recById(lastSummaryId); if (rec) { rec.note = val.slice(0, 2000); saveRec(rec, true); } }, 800);
  }
});
document.addEventListener('focusout', () => { if (pendingRender) setTimeout(() => { const ae = document.activeElement; if (!(ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT'))) { pendingRender = false; onStoreChange(); } }, 50); });
document.addEventListener('visibilitychange', () => {
  if (!S) return;
  if (document.visibilityState === 'hidden') persistActive();
  else { const now = clock(); tick(now); if (S) { liveDyn(now); if (!S.paused) Wake.request(); } }
});

/* small read-only hook for automated checks */
window.__coachTest = {vestOn: (v, kg) => vestOn(v, kg), vestOff: (v, kg) => vestOff(v, kg), vestFor: (b, cap, from) => vestFor(b, cap, from)};
window.__coachDebug = () => ({route: route(), speed: S ? S.speed : null, phase: S ? curPhase().key : null, hrSrc: S ? S.hrSrc : null, hr: HR.bpm, hrState: HR.state, said: Speaker.log.map(x => x.keys), voice: Speaker.state, path: Speaker.path, env: ENV});

/* ================= boot ================= */
function validActive(a) {
  return a && typeof a === 'object' && (a.mode === '4x4' || a.mode === 'z2') && Array.isArray(a.phases) && a.phases.length > 0 && isNum(a.idx) && a.idx >= 0 && a.idx < a.phases.length && isNum(a.startedAt) && a.Z && a.opts && !a.done && !a.demo;
}
function restoreActive(hotActive) {
  const a = hotActive || LS.get(K.active);
  if (!validActive(a)) { if (a) LS.del(K.active); return; }
  const now = Date.now();
  if (now - a.startedAt > 4 * 3600e3) { LS.del(K.active); return; }
  S = Object.assign({hr5: [], hr5Next: 0, spd: [], marks: [], cmds: 0, lastCmdAt: -1e9, coolExt: 0, said: {}, hrSrc: 'manual', z2Next: 0}, a);
  if (S.hrSrc === 'whoop' && HR.mode !== 'ble') S.hrSrc = 'whoop';
  dyn = {};
  if (!S.paused && S.runSince != null) {
    const last = isNum(S.savedAt) ? S.savedAt : now;
    if (!hotActive && now - last > 15 * 60e3) {
      S.accum += Math.max(0, last - S.runSince); S.runSince = null; S.paused = true; S.pausedAt = last; S.closedPause = true;
    }
  }
  ensureLoop();
  if (!S.closedPause) { if (!S.paused) Wake.request(); if (route() !== 'live') location.hash = 'live'; }
}
/* one-tap personal setup link: #me-<max HR>-<resting HR>-<body weight> */
function applySetupHash() {
  const m = /^#me-(\d{3})-(\d{2,3})(?:-(\d{2,3}))?$/.exec(location.hash || '');
  if (!m) return;
  const cur = Store.settings;
  Store.replaceSettings(Object.assign({}, cur, {hrMax: +m[1], hrRest: +m[2], weight: m[3] ? +m[3] : cur.weight}));
  try { history.replaceState(null, '', location.pathname + location.search + '#today'); } catch (e) { location.hash = 'today'; }
  setTimeout(() => toast('Your heart rate zones are set.'), 400);
}
let booted = false;
function boot(data) {
  if (booted) return;
  booted = true;
  Store.init();
  applySetupHash();
  restoreActive(data && data.active);
  render();
  Store.connect();
  setTimeout(() => { Speaker.load(); }, 700);
  setTimeout(() => { BLE.restore(); }, 400);
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({active: S && !S.done && !S.demo ? JSON.parse(JSON.stringify(S)) : null}));
  if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
} catch (e) { boot({}); }
})();
</script>
